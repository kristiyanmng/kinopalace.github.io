<script>

const API_BASE =
  "https://kinopalace-api.kristiyanmarkov44.workers.dev";


let scheduleData = null;

let activeDayIndex = 0;

let activeGenreFilter = "all";

let lastDate = null;

let daysNavigationInitialized = false;

let lastVersion = null;

let isLoadingSchedule = false;


let serverNowBase = null;

let clientNowBase = null;

let serverToday = null;



/* =========================
   START
   ========================= */

loadSchedule(true);



/* =========================
   SERVER TIME
   ========================= */

function getServerNow(){

  if(
    !serverNowBase ||
    clientNowBase === null
  ){

    return new Date();

  }


  const elapsed =
    Date.now() - clientNowBase;


  return new Date(
    serverNowBase.getTime() +
    elapsed
  );

}



function getServerOffsetString(){

  const source =
    serverNowBase ||
    new Date();


  const offsetMinutes =
    -source.getTimezoneOffset();


  const sign =
    offsetMinutes >= 0
      ? "+"
      : "-";


  const abs =
    Math.abs(offsetMinutes);


  const hours =
    String(
      Math.floor(abs / 60)
    ).padStart(2,"0");


  const minutes =
    String(
      abs % 60
    ).padStart(2,"0");


  return `${sign}${hours}:${minutes}`;

}



function getServerTodayISO(){

  if(
    serverToday &&
    /^\d{4}-\d{2}-\d{2}$/.test(
      serverToday
    )
  ){

    return serverToday;

  }


  const now =
    getServerNow();


  const y =
    now.getFullYear();


  const m =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");


  const d =
    String(
      now.getDate()
    ).padStart(2,"0");


  return `${y}-${m}-${d}`;

}



/* =========================
   LOAD SCHEDULE
   ========================= */

async function loadSchedule(
  initial = false
){

  if(isLoadingSchedule)
    return;


  isLoadingSchedule = true;


  try{

    const previousVisibleDays =
      getVisibleDays();


    const previousSelectedIsoDate =
      previousVisibleDays[
        activeDayIndex
      ]?.iso_date || null;



    const response =
      await fetch(

        `${API_BASE}/api/export-schedule`,

        {
          cache:"no-store"
        }

      );


    if(!response.ok){

      throw new Error(
        "Не може да се зареди програмата от API"
      );

    }


    const data =
      await response.json();



    if(data.server_now){

      const parsedServerNow =
        new Date(
          data.server_now
        );


      if(
        !isNaN(
          parsedServerNow.getTime()
        )
      ){

        serverNowBase =
          parsedServerNow;

        clientNowBase =
          Date.now();

      }

    }



    serverToday =
      data.server_today ||
      null;



    scheduleData =
      normalizeScheduleData(
        data
      );



    lastDate =
      getServerNow()
        .getDate();



    document
      .getElementById(
        "week-title"
      )
      .textContent =
        scheduleData.weekTitle ||
        "Програма";



    if(initial){

      setTodayAsActive();

    }
    else{

      const newVisibleDays =
        getVisibleDays();


      const preservedIndex =
        newVisibleDays
          .findIndex(
            day =>
              day.iso_date ===
              previousSelectedIsoDate
          );


      if(
        preservedIndex !== -1
      ){

        activeDayIndex =
          preservedIndex;

      }
      else{

        const todayIndex =
          newVisibleDays
            .findIndex(
              day =>
                isTodayISO(
                  day.iso_date
                )
            );


        activeDayIndex =
          todayIndex !== -1
            ? todayIndex
            : 0;

      }

    }



    renderDays();

    renderGenreFilters();

    renderMovies();

    setupDaysNavigation();



    if(initial){

      await primeVersion();

    }

  }
  catch(error){

    console.error(error);


    document
      .getElementById(
        "movies-container"
      )
      .innerHTML = `

        <div class="maintenance-box">

          <div class="maintenance-icon">
            🎬
          </div>

          <h2>
            В момента се прави подобрение
            по страницата
          </h2>

          <p>
            Надяваме се възможно най-скоро
            да възстановим достъпа
            до програмата.
          </p>

        </div>

      `;

  }
  finally{

    isLoadingSchedule =
      false;

  }

}



/* =========================
   VERSION
   ========================= */

async function primeVersion(){

  try{

    const res =
      await fetch(

        `${API_BASE}/api/public-version`,

        {
          cache:"no-store"
        }

      );


    if(!res.ok)
      return;


    const data =
      await res.json();


    lastVersion =
      data.version ||
      "0";

  }
  catch(e){

    console.error(e);

  }

}



async function checkVersion(){

  try{

    const res =
      await fetch(

        `${API_BASE}/api/public-version`,

        {
          cache:"no-store"
        }

      );


    if(!res.ok)
      return;


    const data =
      await res.json();


    const currentVersion =
      data.version ||
      "0";


    if(!lastVersion){

      lastVersion =
        currentVersion;

      return;

    }


    if(
      currentVersion !==
      lastVersion
    ){

      lastVersion =
        currentVersion;


      await loadSchedule();

    }

  }
  catch(e){

    console.error(e);

  }

}



/* =========================
   NORMALIZE DATA
   ========================= */

function normalizeScheduleData(
  data
){

  return{

    ...data,


    days:
      (data.days || [])
      .map(day => ({

        ...day,


        iso_date:
          day.iso_date ||
          bgToISO(
            day.date
          ),


        movies:
          (day.movies || [])
          .map(movie => ({

            ...movie,


            times:
              normalizeMovieTimes(

                movie.times,

                day.iso_date ||
                bgToISO(
                  day.date
                )

              )

          }))

      }))

  };

}



/* =========================
   NORMALIZE SHOWTIMES
   ========================= */

function normalizeMovieTimes(
  times,
  fallbackIsoDate
){

  if(
    !Array.isArray(times)
  ){

    return [];

  }


  return times
    .map(item => {


      if(
        typeof item ===
        "string"
      ){

        return{

          id:null,

          time:item,

          scheduled_time:item,

          hall:"Зала 1",

          type:"standard",

          iso_date:
            fallbackIsoDate ||
            "",

          is_3d:false,

          is_dubbed:false,

          language_type:
            "subtitled",

          price_standard_eur:0,

          price_reduced_eur:0

        };

      }



      const hall =
        item.hall ||
        "Зала 1";



      return{

        id:
          item.id ??
          null,


        time:
          item.time ||
          item.scheduled_time ||
          "",


        scheduled_time:
          item.scheduled_time ||
          item.time ||
          "",


        hall,


        type:
          item.type ||
          (
            /vip/i.test(hall)
              ? "vip"
              : "standard"
          ),


        iso_date:
          item.iso_date ||
          fallbackIsoDate ||
          "",


        is_3d:
          !!item.is_3d,


        is_dubbed:
          !!item.is_dubbed,


        language_type:
          item.language_type ||
          (
            item.is_dubbed
              ? "dubbed"
              : "subtitled"
          ),


        price_standard_eur:
          Number(
            item.price_standard_eur ||
            0
          ),


        price_reduced_eur:
          Number(
            item.price_reduced_eur ||
            0
          )

      };

    })

    .filter(
      item =>
        item.time
    );

}



/* =========================
   DATES
   ========================= */

function bgToISO(
  dayDate
){

  if(!dayDate)
    return "";


  if(
    /^\d{4}-\d{2}-\d{2}$/
      .test(dayDate)
  ){

    return dayDate;

  }


  const [
    day,
    month,
    yearMaybe
  ] =
    String(dayDate)
      .split(".");


  const year =
    yearMaybe ||
    String(
      getServerNow()
        .getFullYear()
    );


  if(
    !day ||
    !month
  ){

    return "";

  }


  return(

    `${year}-` +
    `${String(month).padStart(2,"0")}-` +
    `${String(day).padStart(2,"0")}`

  );

}



function parseISODate(
  isoDate
){

  return new Date(

    `${isoDate}T00:00:00` +
    getServerOffsetString()

  );

}



function parseTimeToDate(
  isoDate,
  timeString
){

  return new Date(

    `${isoDate}T${timeString}:00` +
    getServerOffsetString()

  );

}



function isFutureOrToday(
  isoDate
){

  const today =
    parseISODate(
      getServerTodayISO()
    );


  today.setHours(
    0,0,0,0
  );


  const dateObj =
    parseISODate(
      isoDate
    );


  dateObj.setHours(
    0,0,0,0
  );


  return(
    dateObj >= today
  );

}



function isTodayISO(
  isoDate
){

  return(
    isoDate ===
    getServerTodayISO()
  );

}



function getVisibleDays(){

  return(
    scheduleData?.days ||
    []
  )
  .filter(
    day =>
      isFutureOrToday(
        day.iso_date
      )
  );

}



/* =========================
   ACTIVE DAY
   ========================= */

function setTodayAsActive(){

  const visibleDays =
    getVisibleDays();


  const todayIndex =
    visibleDays
      .findIndex(
        day =>
          isTodayISO(
            day.iso_date
          )
      );


  if(
    todayIndex !== -1
  ){

    activeDayIndex =
      todayIndex;

    return;

  }



  const firstDayWithMovies =
    visibleDays
      .findIndex(
        day =>

          Array.isArray(
            day.movies
          )

          &&

          day.movies
          .some(
            movie =>

              Array.isArray(
                movie.times
              )

              &&

              movie.times.length > 0

          )

      );


  activeDayIndex =
    firstDayWithMovies !== -1
      ? firstDayWithMovies
      : 0;

}



/* =========================
   RENDER DAYS
   ========================= */

function renderDays(){

  const strip =
    document.getElementById(
      "days-strip"
    );


  const visibleDays =
    getVisibleDays();


  strip.innerHTML =
    "";



  const shortDays = {

    "Понеделник":"Пон",

    "Вторник":"Вт",

    "Сряда":"Ср",

    "Четвъртък":"Чет",

    "Петък":"Пет",

    "Събота":"Съб",

    "Неделя":"Нед"

  };



  visibleDays
    .forEach(
      (
        day,
        index
      ) => {


        const hasMovies =

          !day.disabled

          &&

          Array.isArray(
            day.movies
          )

          &&

          day.movies
          .some(
            movie =>

              Array.isArray(
                movie.times
              )

              &&

              movie.times.length > 0

          );



        const mobileLabel =

          window.innerWidth <= 760

          ?

          (
            shortDays[
              day.label
            ]

            ||

            day.label
          )

          :

          day.label;



        const btn =
          document.createElement(
            "button"
          );



        btn.className =

          "day-tab"

          +

          (
            index ===
            activeDayIndex

            ?

            " active"

            :

            ""
          )

          +

          (
            !hasMovies

            ?

            " empty-day"

            :

            ""
          );



        btn.innerHTML = `

          <span class="day-label">
            ${mobileLabel}
          </span>

          <span class="day-date">
            ${day.date}
          </span>

        `;



        if(
          !hasMovies
        ){

          btn.disabled =
            true;


          btn.title =
            "Няма прожекции за тази дата";

        }
        else{

          btn.addEventListener(
            "click",
            () => {


              activeDayIndex =
                index;


              activeGenreFilter =
                "all";


              renderDays();

              renderGenreFilters();

              renderMovies();

            }
          );

        }



        strip.appendChild(
          btn
        );

      }
    );


  updateDaysArrows();

}



/* =========================
   GENRE FUNCTIONS
   ========================= */

function splitGenres(
  rawGenre
){

  return String(
    rawGenre ||
    ""
  )

  .split(
    /[,/|;]+/
  )

  .map(
    x =>
      x.trim()
  )

  .filter(Boolean);

}



function normalizeGenreKey(
  value
){

  return String(
    value ||
    ""
  )

  .trim()

  .toLocaleLowerCase(
    "bg-BG"
  );

}



/* =========================
   GENRES FOR SELECTED DAY
   ========================= */

function getGenresForActiveDay(){

  const visibleDays =
    getVisibleDays();


  const day =
    visibleDays[
      activeDayIndex
    ];


  if(!day)
    return [];


  const map =
    new Map();



  (day.movies || [])
    .forEach(
      movie => {


        splitGenres(
          movie.genre
        )

        .forEach(
          genre => {


            const key =
              normalizeGenreKey(
                genre
              );


            if(!key)
              return;


            if(
              !map.has(key)
            ){

              map.set(
                key,
                genre
              );

            }

          }
        );

      }
    );



  return[
    ...map.entries()
  ]

  .sort(
    (a,b) =>

      a[1]
      .localeCompare(
        b[1],
        "bg"
      )

  );

}



/* =========================
   RENDER GENRE FILTERS
   ========================= */

function renderGenreFilters(){

  const wrap =
    document.getElementById(
      "genre-filter-wrap"
    );


  const section =
    document.getElementById(
      "genre-filter-section"
    );


  if(
    !wrap ||
    !section
  ){

    return;

  }



  const genres =
    getGenresForActiveDay();



  wrap.innerHTML =
    "";



  /* ВСИЧКИ */

  const allBtn =
    document.createElement(
      "button"
    );


  allBtn.type =
    "button";


  allBtn.className =

    "genre-filter-btn"

    +

    (
      activeGenreFilter ===
      "all"

      ?

      " active"

      :

      ""
    );


  allBtn.textContent =
    "Всички";


  allBtn.addEventListener(
    "click",
    () => {

      setGenreFilter(
        "all"
      );

    }
  );


  wrap.appendChild(
    allBtn
  );



  /* АВТОМАТИЧНИ ЖАНРОВЕ */

  genres.forEach(
    ([key,label]) => {


      const btn =
        document.createElement(
          "button"
        );


      btn.type =
        "button";


      btn.className =

        "genre-filter-btn"

        +

        (
          activeGenreFilter ===
          key

          ?

          " active"

          :

          ""
        );


      btn.textContent =
        label;


      btn.addEventListener(
        "click",
        () => {

          setGenreFilter(
            key
          );

        }
      );


      wrap.appendChild(
        btn
      );

    }
  );



  section.style.display =
    genres.length
      ? ""
      : "none";



  if(

    activeGenreFilter !==
    "all"

    &&

    !genres.some(
      ([key]) =>
        key ===
        activeGenreFilter
    )

  ){

    activeGenreFilter =
      "all";

  }

}



/* =========================
   SELECT GENRE
   ========================= */

function setGenreFilter(
  genreKey
){

  activeGenreFilter =
    genreKey;


  renderGenreFilters();

  renderMovies();

}



/* =========================
   MOVIE MATCHES GENRE
   ========================= */

function movieMatchesGenre(
  movie
){

  if(
    activeGenreFilter ===
    "all"
  ){

    return true;

  }


  return splitGenres(
    movie.genre
  )

  .some(
    genre =>

      normalizeGenreKey(
        genre
      )

      ===

      activeGenreFilter
  );

}



/* =========================
   DAY ARROWS
   ========================= */

function updateDaysArrows(){

  const strip =
    document.getElementById(
      "days-strip"
    );


  const prev =
    document.getElementById(
      "days-prev"
    );


  const next =
    document.getElementById(
      "days-next"
    );


  if(
    !strip ||
    !prev ||
    !next
  ){

    return;

  }


  prev.disabled =
    strip.scrollLeft <= 0;


  next.disabled =

    strip.scrollLeft +
    strip.clientWidth

    >=

    strip.scrollWidth -
    2;

}



/* =========================
   DAY NAVIGATION
   ========================= */

function setupDaysNavigation(){

  if(
    daysNavigationInitialized
  ){

    return;

  }


  daysNavigationInitialized =
    true;



  const strip =
    document.getElementById(
      "days-strip"
    );


  const prev =
    document.getElementById(
      "days-prev"
    );


  const next =
    document.getElementById(
      "days-next"
    );


  if(
    !strip ||
    !prev ||
    !next
  ){

    return;

  }



  prev.addEventListener(
    "click",
    () => {

      strip.scrollBy({

        left:-320,

        behavior:"smooth"

      });

    }
  );



  next.addEventListener(
    "click",
    () => {

      strip.scrollBy({

        left:320,

        behavior:"smooth"

      });

    }
  );



  strip.addEventListener(
    "scroll",
    updateDaysArrows
  );



  window.addEventListener(
    "resize",
    () => {

      renderDays();

      renderGenreFilters();

      updateDaysArrows();

    }
  );


  updateDaysArrows();

}



/* =========================
   SHOWTIME LABEL
   ========================= */

function getShowtimeFormatLabel(
  item
){

  const format =
    item.is_3d
      ? "3D"
      : "2D";


  const languageType =

    item.language_type

    ||

    (
      item.is_dubbed
        ? "dubbed"
        : "subtitled"
    );



  let language =
    "СУБТ.";



  if(
    languageType ===
    "dubbed"
  ){

    language =
      "ДУБЛ.";

  }


  else if(
    languageType ===
    "original"
  ){

    language =
      "ОРИГ.";

  }



  return(
    `${format} ${language}`
  );

}



/* =========================
   RENDER MOVIES
   ========================= */

function renderMovies(){

  const container =
    document.getElementById(
      "movies-container"
    );


  const visibleDays =
    getVisibleDays();


  const day =
    visibleDays[
      activeDayIndex
    ];



  container.innerHTML =
    "";



  if(!day){

    container.innerHTML = `

      <p
        style="
          color:#fde68a;
          font-weight:700;
        "
      >
        Няма налична програма
        за показване.
      </p>

    `;

    return;

  }



  const now =
    getServerNow();


  const isSelectedDayToday =
    isTodayISO(
      day.iso_date
    );



  const preparedMovies =

    (day.movies || [])


    /* ФИЛТЪР ПО ЖАНР */

    .filter(
      movie =>
        movieMatchesGenre(
          movie
        )
    )


    .map(
      (
        movie,
        index
      ) => {


        const visibleTimes =

          (movie.times || [])

          .map(
            item => ({

              ...item,


              dateObj:
                parseTimeToDate(

                  day.iso_date,

                  item.scheduled_time ||
                  item.time

                )

            })
          )


          .filter(
            item => {


              if(
                !isSelectedDayToday
              ){

                return true;

              }


              return(
                item.dateObj >
                now
              );

            }
          )


          .sort(
            (a,b) =>
              a.dateObj -
              b.dateObj
          );



        if(
          visibleTimes.length === 0
        ){

          return null;

        }



        const nextTime =
          visibleTimes[0];


        const diffMs =
          nextTime.dateObj -
          now;


        const totalSeconds =
          Math.max(

            0,

            Math.floor(
              diffMs /
              1000
            )

          );


        const hours =
          Math.floor(
            totalSeconds /
            3600
          );


        const minutes =
          Math.floor(

            (
              totalSeconds %
              3600
            )

            /

            60

          );


        const seconds =
          totalSeconds %
          60;



        let text =
          "";



        if(
          hours > 0
        ){

          text =
            `${hours}ч ` +
            `${minutes}м ` +
            `${seconds}с`;

        }


        else if(
          minutes > 0
        ){

          text =
            `${minutes}м ` +
            `${seconds}с`;

        }


        else{

          text =
            `${seconds}с`;

        }



        return{

          ...movie,


          _id:index,


          visibleTimes,


          sortTime:
            nextTime.dateObj,


          nextCountdown:{

            time:
              nextTime.scheduled_time ||
              nextTime.time,


            hall:
              nextTime.hall,


            text,


            dateObj:
              nextTime.dateObj

          },


          showNextCountdown:
            false

        };

      }
    )


    .filter(Boolean)


    .sort(
      (a,b) =>
        a.sortTime -
        b.sortTime
    );



  /* =========================
     НЯМА РЕЗУЛТАТИ
     ========================= */

  if(
    preparedMovies.length === 0
  ){

    const activeButton =
      document.querySelector(
        ".genre-filter-btn.active"
      );


    const genreName =
      activeButton?.textContent ||
      "";



    if(
      activeGenreFilter !==
      "all"
    ){

      container.innerHTML = `

        <p
          style="
            color:#fde68a;
            font-weight:700;
          "
        >

          Няма прожекции от жанр

          „${genreName}“

          за този ден.

        </p>

      `;

    }
    else{

      container.innerHTML = `

        <p
          style="
            color:#fde68a;
            font-weight:700;
          "
        >

          Все още няма налични
          прожекции за този ден.

        </p>

      `;

    }


    return;

  }



  /* =========================
     NEXT SCREENING
     ========================= */

  if(
    isSelectedDayToday
  ){

    const globalNextMovieIndex =
      preparedMovies
        .findIndex(
          movie =>
            movie.nextCountdown
        );


    if(
      globalNextMovieIndex !==
      -1
    ){

      preparedMovies[
        globalNextMovieIndex
      ]
      .showNextCountdown =
        true;

    }

  }



  /* =========================
     MOVIE CARDS
     ========================= */

  preparedMovies
    .forEach(
      movie => {


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "card";


        card.setAttribute(

          "data-movie-index",

          movie._id

        );



        /* =========================
           HOURS
           ========================= */

        const timesHtml =

          movie.visibleTimes
          .map(
            item => `

              <span
                class="
                  time
                  ${
                    item.type === "vip"
                      ? "vip-time"
                      : "standard-time"
                  }
                "
              >

                <span class="showtime-format">
                  ${getShowtimeFormatLabel(item)}
                </span>

                <span class="time-value">
                  ${
                    item.scheduled_time ||
                    item.time
                  }
                </span>

                <small class="hall-label">
                  ${item.hall || ""}
                </small>

              </span>

            `
          )
          .join("");



        /* =========================
           PRICES
           ========================= */

        const firstPricedTime =

          movie.visibleTimes
          .find(
            item =>

              Number(
                item.price_standard_eur ||
                0
              ) > 0

              ||

              Number(
                item.price_reduced_eur ||
                0
              ) > 0

          );



        const hasStandardPrice =

          Number(
            firstPricedTime
              ?.price_standard_eur ||
            0
          ) > 0;



        const hasReducedPrice =

          Number(
            firstPricedTime
              ?.price_reduced_eur ||
            0
          ) > 0;



        const priceHtml =

          (
            hasStandardPrice ||
            hasReducedPrice
          )

          ?

          `

            <div class="ticket-prices">

              <div class="ticket-prices-title">
                Билети:
              </div>


              ${
                hasStandardPrice
                ?

                `

                  <div class="ticket-price-line">

                    <span class="ticket-price-label">
                      Стандартен
                    </span>

                    <span class="ticket-price-value">

                      €${
                        Number(
                          firstPricedTime
                            .price_standard_eur
                        )
                        .toFixed(2)
                      }

                    </span>

                  </div>

                `

                :

                ""
              }



              ${
                hasReducedPrice
                ?

                `

                  <div class="ticket-price-line">

                    <span class="ticket-price-label">
                      Намален
                    </span>

                    <span class="ticket-price-value">

                      €${
                        Number(
                          firstPricedTime
                            .price_reduced_eur
                        )
                        .toFixed(2)
                      }

                    </span>

                  </div>

                `

                :

                ""
              }

            </div>

          `

          :

          "";



        /* =========================
           NEXT COUNTDOWN
           ========================= */

        const countdownHtml =

          movie.showNextCountdown

          &&

          movie.nextCountdown

          ?

          `

            <div class="next-countdown">

              <div class="next-countdown-header">

                <span class="next-badge">
                  Следваща прожекция
                </span>


                <span class="next-time">

                  ${movie.nextCountdown.time}

                  ${
                    movie.nextCountdown.hall

                    ?

                    ` • ${movie.nextCountdown.hall}`

                    :

                    ""
                  }

                </span>

              </div>


              <div class="next-countdown-text">

                Започва след
                ${movie.nextCountdown.text}

              </div>

            </div>

          `

          :

          "";



        /* =========================
           TRAILER
           ========================= */

        const safeTrailer =

          String(
            movie.trailer ||
            ""
          )

          .replace(
            /'/g,
            "\\'"
          );



        const trailerButton =

          movie.trailer

          ?

          `

            <button
              class="trailer-btn"
              onclick="
                openTrailer(
                  '${safeTrailer}'
                )
              "
            >

              ▶ Трейлър

            </button>

          `

          :

          "";



        /* =========================
           MOVIE CARD
           ========================= */

        card.innerHTML = `

          <img
            class="poster"
            src="${movie.poster || ""}"
            alt="${movie.title || ""}"
          >


          <div class="card-body">


            <h3>
              ${movie.title || "Без заглавие"}
            </h3>



            <!--
              ЖАНРЪТ НАРОЧНО НЕ СЕ ПОКАЗВА.
              Използва се само от филтъра.
            -->


            <div class="meta">

              <div>

                <strong>
                  Продължителност:
                </strong>

                ${
                  movie.duration ||
                  "Няма информация"
                }

              </div>


              <div>

                <strong>
                  Разпространител:
                </strong>

                ${
                  movie.distributor ||
                  "Няма информация"
                }

              </div>

            </div>



            <div class="actions">

              ${trailerButton}

            </div>



            <div class="times">

              <div class="schedule-group">

                <div class="schedule-hours">

                  ${timesHtml}

                </div>

              </div>

            </div>



            ${priceHtml}


            ${countdownHtml}



            <span class="badge">

              Категория:

              ${
                movie.category ||
                "Няма информация"
              }

            </span>


          </div>

        `;



        container.appendChild(
          card
        );

      }
    );

}



/* =========================
   TRAILER
   ========================= */

function openTrailer(
  url
){

  if(!url)
    return;


  const modal =
    document.getElementById(
      "trailerModal"
    );


  const frame =
    document.getElementById(
      "trailerFrame"
    );


  const separator =
    url.includes("?")
      ? "&"
      : "?";


  frame.src =

    url +

    separator +

    "autoplay=1";


  modal.classList.add(
    "active"
  );

}



function closeTrailer(){

  const modal =
    document.getElementById(
      "trailerModal"
    );


  const frame =
    document.getElementById(
      "trailerFrame"
    );


  frame.src =
    "";


  modal.classList.remove(
    "active"
  );

}



function outsideClose(
  event
){

  const content =
    document.querySelector(
      ".modal-content"
    );


  if(

    content

    &&

    !content.contains(
      event.target
    )

  ){

    closeTrailer();

  }

}



/* =========================
   AUTO REFRESH
   ========================= */

function refreshUI(){

  if(!scheduleData)
    return;


  const now =
    getServerNow();



  if(
    now.getDate() !==
    lastDate
  ){

    lastDate =
      now.getDate();


    loadSchedule();

    return;

  }


  renderMovies();

}



setInterval(
  () => {

    refreshUI();

  },
  1000
);



setInterval(
  () => {

    checkVersion();

  },
  30000
);



setInterval(
  () => {

    loadSchedule();

  },
  600000
);



document.addEventListener(
  "visibilitychange",
  () => {

    if(
      !document.hidden
    ){

      checkVersion();

    }

  }
);



window.addEventListener(
  "focus",
  () => {

    checkVersion();

  }
);



/* =========================
   THEME
   ========================= */

const toggleBtn =
  document.getElementById(
    "theme-toggle"
  );


const savedTheme =
  localStorage.getItem(
    "theme"
  )

  ||

  "dark";



if(
  savedTheme ===
  "light"
){

  document.body
    .classList
    .add(
      "light"
    );


  toggleBtn.textContent =
    "☀️";

}
else{

  document.body
    .classList
    .remove(
      "light"
    );


  toggleBtn.textContent =
    "🌙";

}



toggleBtn.addEventListener(
  "click",
  () => {


    const isLight =

      document.body
      .classList
      .toggle(
        "light"
      );


    localStorage.setItem(

      "theme",

      isLight
        ? "light"
        : "dark"

    );


    toggleBtn.textContent =

      isLight
        ? "☀️"
        : "🌙";

  }
);



/* =========================
   FOOTER YEAR
   ========================= */

document
  .getElementById(
    "year"
  )
  .textContent =

    new Date()
    .getFullYear();
